<div class="modal" id="certModal" aria-hidden="true">
        <div class="modal-box modal-wide" role="dialog" aria-modal="true" aria-labelledby="certTitle">
            <button class="modal-close" id="certClose" aria-label="Close">&times;</button>
            <span class="eyebrow" id="certProvider">CERTIFICATE</span>
            <h2 id="certTitle"></h2>
            <p class="modal-desc" id="certDesc"></p>
            <div class="cert-preview">
                <img id="certImage" src="" alt="">
            </div>
            <div class="modal-actions">
                <a id="certDownload" class="btn btn-primary" href="#" download>Download PDF <span>&#8595;</span></a>
                <button class="btn btn-outline" id="certToggle">Show Certificate</button>
            </div>
        </div>
    </div>
